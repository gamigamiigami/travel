# ------------------------------------------------------------------
# Yahoo!トラベル スペシャルクーポン ウォッチャー v2  設定ファイル
# このファイルを config.yaml という名前でコピーして編集してください。
#
# ★ パスワードやトピック名は config.yaml ではなく .env に書けます（推奨）。
#    .env のほうが優先されます。
# ------------------------------------------------------------------

notify:
  # 複数同時に指定できます。ntfy / discord / email / windows / console
  # 既定は「スマホ(ntfy) ＋ PCのトースト通知」の二段構え。
  providers:
    - ntfy
    - windows

  ntfy:
    server: https://ntfy.sh
    # .env の NTFY_TOPIC に書けばここは空でOK。
    # 他人に推測されない長めのランダム文字列にしてください。
    topic: ""
    priority: 5
    attach_screenshot: true

  windows:
    app_id: "Yahoo Travel Coupon Watcher"
    enabled: true

  discord:
    webhook_url: ""      # .env の DISCORD_WEBHOOK_URL でも可

  email:
    smtp_host: smtp.gmail.com
    smtp_port: 465
    username: ""         # .env の EMAIL_USERNAME
    password: ""         # .env の EMAIL_PASSWORD（Gmailはアプリパスワード）
    from_addr: ""
    to_addr: ""          # .env の EMAIL_TO

  also_console: true

# Edge と Chrome は別プロファイル＝別の抽選枠として回します
browsers:
  - edge
  - chrome

crawl:
  headless: false        # true にするとウィンドウが出ません（常駐向け）
  start_url: https://travel.yahoo.co.jp/

  # 毎ラウンド必ず見に行くページ。
  # ★ 実際にクーポンが出たページを見つけたら、ここに足していくのが一番効きます。
  targets:
    - name: "トップページ"
      url: "https://travel.yahoo.co.jp/"
    # 例: よく泊まるエリアの検索結果や、狙っている宿の詳細ページ
    # - name: "箱根の宿"
    #   url: "https://travel.yahoo.co.jp/domestic/area/..."

  # 各ターゲットから何ページぶんリンクを辿って潜るか [最小, 最大]
  # 「具体的に宿を調べる」動きを作る部分です。
  wander_pages_per_target: [2, 4]

  interval_minutes: [12, 25]     # 次のラウンドまでの待ち時間 [最小, 最大]
  page_dwell_seconds: [6, 18]    # 1ページを眺める秒数 [最小, 最大]
  scroll_steps: [2, 5]
  nav_timeout_seconds: 45

  quiet_hours: [1, 7]            # この時間帯は巡回しない
  max_rounds: 0                  # 0 = 無制限
  max_rounds_per_day: 40         # 1日あたりの上限（アクセスしすぎの歯止め）

  allowed_host_suffix: travel.yahoo.co.jp

  # 絶対に踏まないURL。予約確定や決済に触れないための安全装置です。消さないでください。
  blocked_url_patterns:
    - "/reserve"
    - "/reservation"
    - "/booking"
    - "/payment"
    - "/order"
    - "/cart"
    - "/checkout"
    - "/confirm"
    - "/settlement"
    - "logout"
    - "login"
    - "signin"
    - "account"
    - "mypage"
    - "edit\\.yahoo"
    - "login\\.yahoo"
    - "accounts\\.yahoo"
    - "/review/(post|write)"
    - "/inquiry"
    - "/contact"
    - "/cancel"

  preferred_url_patterns:
    - "/dp/"
    - "/hotel"
    - "/domestic"
    - "/area"
    - "/search"
    - "/onsen"
    - "/theme"
    - "/ranking"

detect:
  min_amount: 1000
  max_amount: 100000
  amounts_whitelist: []          # 例: [3000, 5000, 50000] で金額を絞れる

  # 何点以上でクーポンとみなすか。通知には点数と根拠が載ります。
  # 通知が多すぎる → 数字を上げる / 出たのに来ない → 下げる
  #   スペシャルクーポン +5 / 限定クーポン +4 / 獲得ボタン +3 / 時間限定 +3
  #   残り分数の表記 +4 / 円OFF表記 +2 / クーポンコード +2 / クーポン +1
  min_score_page: 7              # ページ全体を見るとき（厳しめ）
  min_score_popup: 4             # ポップアップの中を見るとき（緩め）

  auto_claim: true
  claim_button_texts:
    - "クーポンを獲得"
    - "獲得する"
    - "クーポンをもらう"
    - "受け取る"
    - "クーポンをゲット"
    - "ゲットする"
    - "今すぐ獲得"

  ignore_patterns: []            # 誤検知したら、その文言を正規表現で足す
  dedupe_minutes: 180
  screenshot: true
  network_scan: true

# 検出の有無にかかわらず全チェック結果をCSVに残し、stats コマンドで集計します。
# 「Edgeのほうが出やすい」「夜のほうが出やすい」を自分のデータで検証するため。
history:
  enabled: true
  file: history.csv

paths:
  profiles_dir: profiles
  data_dir: data
  logs_dir: logs
